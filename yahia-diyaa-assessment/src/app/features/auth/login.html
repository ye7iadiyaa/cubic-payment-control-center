<div class="min-h-screen flex items-center justify-center bg-surface-50 dark:bg-surface-950 px-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <h1 class="text-2xl font-semibold text-surface-900 dark:text-surface-0">Payment Control Center</h1>
      <p class="text-surface-500 mt-1">Corporate Banking &mdash; sign in as a demo user</p>
    </div>

    <div class="bg-surface-0 dark:bg-surface-900 border border-surface-200 dark:border-surface-700 rounded-xl shadow-sm divide-y divide-surface-200 dark:divide-surface-700">
      @for (user of users(); track user.userId) {
        <button
          type="button"
          class="w-full flex items-center justify-between gap-3 px-5 py-4 text-left hover:bg-surface-50 dark:hover:bg-surface-800 transition-colors disabled:opacity-60"
          [disabled]="loadingUserId() !== null"
          (click)="signIn(user)"
        >
          <span>
            <span class="block font-medium text-surface-900 dark:text-surface-0">{{ user.displayName }}</span>
            <span class="block text-sm text-surface-500">{{ user.userId }}</span>
          </span>
          <p-tag [value]="user.role" [severity]="roleSeverity(user.role)" />
        </button>
      } @empty {
        <div class="px-5 py-6 text-center text-surface-500">Loading demo users&hellip;</div>
      }
    </div>
  </div>
</div>
