<div class="min-h-screen bg-surface-50 dark:bg-surface-950">
  <header class="bg-surface-0 dark:bg-surface-900 border-b border-surface-200 dark:border-surface-700">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 flex items-center justify-between h-16">
      <div class="flex items-center gap-8">
        <span class="font-semibold text-surface-900 dark:text-surface-0">Payment Control Center</span>
        <nav class="flex items-center gap-1">
          <a
            routerLink="/payments"
            routerLinkActive="bg-surface-100 dark:bg-surface-800 text-primary-600"
            [routerLinkActiveOptions]="{ exact: false }"
            class="px-3 py-2 rounded-md text-sm font-medium text-surface-600 dark:text-surface-300 hover:bg-surface-100 dark:hover:bg-surface-800"
          >
            Payments
          </a>
          @if (auth.role() === 'MAKER') {
            <a
              routerLink="/bulk-upload"
              routerLinkActive="bg-surface-100 dark:bg-surface-800 text-primary-600"
              class="px-3 py-2 rounded-md text-sm font-medium text-surface-600 dark:text-surface-300 hover:bg-surface-100 dark:hover:bg-surface-800"
            >
              Bulk Upload
            </a>
          }
        </nav>
      </div>

      <div class="flex items-center gap-3">
        <div class="text-right leading-tight">
          <div class="text-sm font-medium text-surface-900 dark:text-surface-0">{{ auth.currentUser()?.displayName }}</div>
          <p-tag [value]="auth.role() ?? ''" [severity]="roleSeverity()" class="text-xs" />
        </div>
        <p-button icon="pi pi-sign-out" [text]="true" severity="secondary" (onClick)="logout()" />
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-6">
    <router-outlet />
  </main>
</div>
